name: Deploy EV Dashboard

on:
  push:
    branches:
      - main

    paths:
      - "app.py"
      - "utils/**"
      - "resources/**"
      - ".streamlit/**"
      - "requirements.txt"
      - "data_pipeline/**"

  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: ev-dashboard-deploy
  cancel-in-progress: true

env:
  AWS_REGION: ap-south-1
  EC2_INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
  APP_DIR: /home/ubuntu/ev-scooter-sentiment-analysis

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------
      # 1. Configure AWS via OIDC
      # --------------------------------------------------
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # --------------------------------------------------
      # 2. Deploy to EC2 via SSM
      # --------------------------------------------------
      - name: Deploy application to EC2
        id: deploy
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --document-name "AWS-RunShellScript" \
            --instance-ids "$EC2_INSTANCE_ID" \
            --comment "Deploy Streamlit app - ${GITHUB_SHA}" \
            --parameters 'commands=[
              "sudo -u ubuntu -H bash -lc '\''cd /home/ubuntu/ev-scooter-sentiment-analysis && git fetch origin main && git reset --hard origin/main'\''",
              "sudo -u ubuntu -H /home/ubuntu/ev-scooter-sentiment-analysis/.venv/bin/pip install -r /home/ubuntu/ev-scooter-sentiment-analysis/requirements.txt",
              "systemctl restart streamlit",
              "systemctl is-active --quiet streamlit"
              ]' \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          echo "COMMAND_ID=$COMMAND_ID" >> "$GITHUB_ENV"

      # --------------------------------------------------
      # 3. Wait for SSM command
      # --------------------------------------------------
      - name: Wait for deployment
        run: |
          set +e

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "$EC2_INSTANCE_ID"

          WAIT_STATUS=$?

          set -e

          echo "Wait status: $WAIT_STATUS"

      # --------------------------------------------------
      # 4. Read deployment result
      # --------------------------------------------------
      - name: Check deployment result
        run: |

          STATUS=$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$EC2_INSTANCE_ID" \
            --query "Status" \
            --output text)

          echo "Deployment status: $STATUS"

          echo ""
          echo "----- STDOUT -----"

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$EC2_INSTANCE_ID" \
            --query "StandardOutputContent" \
            --output text

          echo ""
          echo "----- STDERR -----"

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$EC2_INSTANCE_ID" \
            --query "StandardErrorContent" \
            --output text

          if [ "$STATUS" != "Success" ]; then
            echo "Deployment failed."
            exit 1
          fi

          echo "Deployment successful."