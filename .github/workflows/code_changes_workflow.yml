name: Deploy EV Dashboard

on:
  push:
    branches:
      - main

    paths:
      - "app.py"
      - "utils/**"
      - "resources/**"
      - "requirements.txt"

  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: ev-dashboard-deploy
  cancel-in-progress: true

env:
  AWS_REGION: ap-south-1
  EC2_INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
  APP_DIR: /home/ubuntu/ev-scooter-sentiment-analysis

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------
      # 1. Configure AWS via OIDC
      # --------------------------------------------------
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # --------------------------------------------------
      # 2. Deploy to EC2 via SSM
      # --------------------------------------------------
      - name: Deploy application to EC2
        id: deploy
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --document-name "AWS-RunShellScript" \
            --instance-ids "$EC2_INSTANCE_ID" \
            --comment "Deploy Streamlit app - ${GITHUB_SHA}" \
            --parameters 'commands=[
              "sudo -u ubuntu -H bash -lc '\''cd /home/ubuntu/ev-scooter-sentiment-analysis && git fetch --quiet origin main && git restore --source=origin/main --worktree -- app.py requirements.txt resources/ utils/'\''",
              "systemctl restart streamlit",
              "systemctl is-active --quiet streamlit"
              ]' \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          echo "COMMAND_ID=$COMMAND_ID" >> "$GITHUB_ENV"


      - name: Wait for deployment and report result
        shell: bash
        timeout-minutes: 11
        run: |
          set -uo pipefail

          DEADLINE=$((SECONDS + 600))
          STATUS="Pending"

          while (( SECONDS < DEADLINE )); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$EC2_INSTANCE_ID" \
              --query "Status" \
              --output text 2>/dev/null || true)

            echo "Current SSM status: $STATUS"

            case "$STATUS" in
              Success|Failed|TimedOut|Cancelled)
                break
                ;;
            esac

            sleep 10
          done

          echo "----- FINAL RESULT -----"

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$EC2_INSTANCE_ID" \
            --query '{
              Status:Status,
              StatusDetails:StatusDetails,
              ResponseCode:ResponseCode,
              Stdout:StandardOutputContent,
              Stderr:StandardErrorContent
            }' \
            --output json || true

          if [ "$STATUS" != "Success" ]; then
            echo "Deployment did not succeed. Status: $STATUS"
            exit 1
          fi

          echo "Deployment successful."