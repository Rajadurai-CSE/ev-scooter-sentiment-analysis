name: EV Review Data Pipeline

on:
  schedule:
    - cron: "0 2 1,15 * *"
      timezone: "Asia/Kolkata"

  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: ev-review-data-pipeline
  cancel-in-progress: false

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  S3_BUCKET: ${{ secrets.S3_BUCKET }}
  GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

jobs:
  pipeline:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repo
        uses: actions/checkout@v7


      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"


      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt


      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_DATA_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}


      - name: Create Data Dir
        run: mkdir -p data


      - name: Pull Latest Data from s3 latest and populate to Data Dir 
        run:  |
          echo "Downloading master_reviews.csv..."
          aws s3 cp \
            "s3://${S3_BUCKET}/latest/master_reviews.csv" \
            "data/master_reviews.csv"
          
          echo "Downloading clean_reviews.csv..."
            aws s3 cp \
            "s3://${S3_BUCKET}/latest/clean_reviews.csv" \
            "data/clean_reviews.csv"


      - name: Run scraper
        working-directory: data_pipeline
        run: |
          python scraper.py 


      - name: Run cleaner
        working-directory: data_pipeline
        run: |
          python cleaner.py 


      - name: Run sentiment analysis
        working-directory: data_pipeline
        run: |
          python sentiment.py 


      - name: Run topic modelling
        working-directory: data_pipeline
        run: |
          python topic_modelling.py 


      - name: Generate AI insights
        working-directory: data_pipeline
        run: |
          python ai_insights.py 

      # --------------------------------------------------
      # 12. Validate final outputs
      # --------------------------------------------------
      # - name: Validate generated files
      #   run: |
      #     test -s data/master_reviews.csv
      #     test -s data/sentiment_reviews.csv
      #     test -s data/topic_reviews.csv
      #     test -s data/ai_insights.json

      #     python -m json.tool data/ai_insights.json > /dev/null

      #     echo "All pipeline outputs are valid."



      - name: Get Current Date
        id: date
        run: echo "CURRENT_DATE=$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT


      - name: Upload data to S3 Releases
        run: |
          echo "Uploading files in data dir to releases dir in s3 ..."
          aws s3 cp data/ s3://${S3_BUCKET}/releases/${steps.date.output.CURRENT_DATE}/ --recursive

      - name: Upload log data to S3 Releases
        run: |
          echo "Uploading files in data dir to releases dir in s3 ..."
          aws s3 cp logs/application.log s3://${S3_BUCKET}/releases/${steps.date.output.CURRENT_DATE}/application.log

      - name: Upload data to S3 Latest 
        run: |
          echo "Uploading files in data dir to latest dir in s3 ..."
          aws s3 cp data/ s3://${S3_BUCKET}/latest/ --recursive


      - name: Publish READY marker
        run: |
          printf "ready\n" > _READY

          aws s3 cp \
            "_READY" \
            "s3://${S3_BUCKET}/latest/_READY"

          echo "READY marker published."
          echo "EventBridge should now restart Streamlit."